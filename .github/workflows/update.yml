name: セール情報を更新

on:
  schedule:
    # 日本時間 7:05 / 12:05 / 18:05 / 22:05（UTCで書く）
    - cron: "5 22,3,9,13 * * *"
  workflow_dispatch: {}   # 手動でも実行できる

concurrency:
  group: update   # 同時に2つ動かない
  cancel-in-progress: false

permissions:
  contents: write
  issues: write   # 値下がり通知に使う

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yahoo!からセール品を取得
        env:
          YAHOO_APPID: ${{ secrets.YAHOO_APPID }}
          VC_AFFILIATE_ID: ${{ secrets.VC_AFFILIATE_ID }}
        run: python fetch_deals.py docs/deals.json
      - name: いつもチェックの商品を確認
        env:
          YAHOO_APPID: ${{ secrets.YAHOO_APPID }}
          VC_AFFILIATE_ID: ${{ secrets.VC_AFFILIATE_ID }}
          WATCH_SHEET_ID: 1aGOB0zS0ScsIMEWC4SFFK44JK1-vttJ3MshqpLk6mp8
        run: python watch.py
        continue-on-error: true
      - name: 値下がりがあれば通知（GitHubからメールが届く）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f alerts.txt ]; then
            gh issue create --title "値下がり通知 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')" --body-file alerts.txt --assignee "${{ github.repository_owner }}"
          fi
      - name: 変更があれば保存
        run: |
          git config user.name "yasune-bot"
          git config user.email "yasune-bot@users.noreply.github.com"
          git add docs/*.json
          git diff --cached --quiet || git commit -m "セール情報を更新"
          git pull --rebase origin main   # 途中でほかの変更が入っていても保存できるように
          git push
