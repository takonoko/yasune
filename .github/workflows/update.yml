name: セール情報を更新

on:
  schedule:
    # 日本時間 7:05 / 12:05 / 18:05 / 22:05（UTCで書く）
    - cron: "5 22,3,9,13 * * *"
  workflow_dispatch: {}   # 手動でも実行できる

concurrency:
  group: update   # 同時に2つ動かない
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yahoo!からセール品を取得
        env:
          YAHOO_APPID: ${{ secrets.YAHOO_APPID }}
          VC_AFFILIATE_ID: ${{ secrets.VC_AFFILIATE_ID }}
        run: python fetch_deals.py docs/deals.json
      - name: 検索用の商品ページとサイトマップを作る
        run: python gen_pages.py
      - name: 変更があれば保存
        run: |
          git config user.name "yasune-bot"
          git config user.email "yasune-bot@users.noreply.github.com"
          git add docs/*.json docs/item-*.html docs/index.html docs/sitemap.xml
          git add -u docs
          git diff --cached --quiet || git commit -m "セール情報を更新"
          # 途中でほかの変更（家のPCの記録など）が入っていても保存できるように。ぶつかったらこの更新の結果を優先
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && break
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
