<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>商品の詳細 | ヤスネ帳</title>
<meta name="description" content="セール品の実質価格・送料・ポイントキャンペーンの説明">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8742c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#2a3138; --muted:#6b7680; --line:#e3e8ec;
  --accent:#e8742c; --accent-soft:#fdeee3; --accent-ink:#b4521a;
  --point:#1f8a5b; --point-soft:#e4f4ec;
  --warn:#b3261e; --warn-soft:#fdecea;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c2228; --surface:#252c33; --fg:#e9edf0; --muted:#a3adb5; --line:#343d45;
  --accent:#f29a5c; --accent-soft:#3a2c22; --accent-ink:#f6b98c;
  --point:#5cc995; --point-soft:#1f3a2e; --warn:#f2b8b5; --warn-soft:#3b1f1d; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 var(--body)}
img{max-width:100%}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding-block:16px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top img{width:36px;height:36px;border-radius:50%}
.top a{font:700 1.15rem var(--round);text-decoration:none}
.back{margin-left:auto;font-size:.85rem;color:var(--muted)}
.box{background:var(--surface);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(30,40,50,.06)}
.hero{display:grid;gap:14px}
@media (min-width:600px){.hero{grid-template-columns:240px minmax(0,1fr);align-items:start}}
.photo{background:#fff;border-radius:12px;aspect-ratio:1;display:grid;place-items:center;padding:10px}
.photo img{width:100%;height:100%;object-fit:contain}
.maker{font-size:.8rem;color:var(--muted)}
h1{font:700 1.1rem/1.5 var(--body);margin:2px 0 8px;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.badge{font:700 .78rem var(--round);background:var(--accent-soft);color:var(--accent-ink);padding:3px 10px;border-radius:999px}
.now{font:700 1.8rem var(--round);font-variant-numeric:tabular-nums}
.now small{font-size:.9rem}
.was{color:var(--muted);text-decoration:line-through;margin-left:8px;font-size:.9rem}
.rows{display:grid;gap:0;margin:10px 0 0;font-variant-numeric:tabular-nums}
.rows div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:.92rem}
.rows dt{color:var(--muted)}
.rows dd{margin:0;text-align:right;font-weight:500}
.rows .big dd{font:700 1.15rem var(--round);color:var(--point)}
.rows .total dd{font:700 1.15rem var(--round);color:var(--accent-ink)}
h2{font:700 1.02rem var(--round);margin:0 0 8px}
.warn{background:var(--warn-soft);color:var(--warn)}
.ok{background:var(--point-soft);color:var(--point)}
.pill{border-radius:10px;padding:8px 12px;font-weight:700;margin-bottom:8px}
ul,ol{margin:0;padding-left:1.3em}
li{margin:3px 0}
.small{font-size:.82rem;color:var(--muted)}
.entry{border:2px solid var(--accent)}
.entry ol li b{color:var(--accent-ink)}
.five{background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:6px 10px;font-weight:700;margin-bottom:8px}
.go{display:block;text-align:center;background:var(--accent);color:#fff;font:700 1.05rem var(--round);text-decoration:none;padding:14px;border-radius:14px;margin:14px 0 6px}
@media (prefers-color-scheme:dark){.go{color:#1c2228}}
.go:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.empty{text-align:center;padding:40px 0;color:var(--muted)}
#kaidoki .kd{border:1px solid var(--line);margin:10px 0}
.foot{font-size:.75rem;color:var(--muted);display:grid;gap:4px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.webp" alt="" width="36" height="36"><a href="./">ヤスネ帳</a><a class="back" href="./">← 一覧にもどる</a></div>
  <main id="main"><p class="empty">読み込み中…</p></main>
  <div class="foot">
    <span>価格・在庫・ポイント・送料は更新時点のものです。購入前に販売ページで必ずご確認ください。</span>
    <span>当サイトはアフィリエイト広告を利用しています。</span>
    <span><a href="https://developer.yahoo.co.jp/sitemap/" target="_blank" rel="noopener">Web Services by Yahoo! JAPAN</a></span>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
const num=v=>Number(v).toLocaleString("ja-JP");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const STORE={yahoo:"Yahoo!ショッピング",rakuten:"楽天市場",amazon:"Amazon"};
const id=new URLSearchParams(location.search).get("id");
const today=Number(new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",day:"numeric"}).format(new Date()).replace(/\D/g,""));
const isFive=[5,15,25].includes(today);

function endText(t){if(!t)return"";const d=new Date(t*1000);if(d<new Date())return"";
  return new Intl.DateTimeFormat("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",hour:"numeric",minute:"2-digit"}).format(d)+" まで"}

function shipBox(d){
  const free=d.ship===2||(d.ship==null&&d.free_shipping);
  const real=d.real??d.now;
  if(free) return `<div class="pill ok">送料無料（表示価格に送料が入っています）</div>`;
  let h="";
  if(d.postage>0){
    h+=`<div class="pill warn">⚠ 送料 ${num(d.postage)}円${d.postage_pref?`（${esc(d.postage_pref)}あての場合）`:""}</div>`;
  }else{
    h+=`<div class="pill warn">⚠ 送料がかかります（金額はお店のページで確認）</div>`;
  }
  h+="<ul>";
  if(d.free_cond) h+=`<li><b>${esc(d.free_cond)}送料無料</b>になります。同じお店の商品と合わせ買いすると送料がかからないことがあります。</li>`;
  else if(d.ship===3) h+=`<li>条件を満たすと送料無料になるお店です（条件の金額はお店のページで確認してください）。</li>`;
  if(d.postage>0) h+=`<li>この商品1つだけ買うと、ポイントを引いた後で <b>送料込み ${num(real+d.postage)}円</b> です。</li>`;
  h+=`<li>送料は届け先の都道府県で変わります。上の金額は目安です。</li></ul>`;
  return h;
}

function render(d){
  const real=d.real??d.now;
  const badges=[];
  if(d.off) badges.push(`${d.off}%OFF`);
  if(d.pt_rate>=10) badges.push(`ポイント${Math.floor(d.pt_rate)}%還元`);
  if(d.unit_price) badges.push(`1${esc(d.unit)} ${num(Math.round(d.unit_price))}円`);
  const end=endText(d.end);
  const under3000=real<3000;
  const camp=d.camp_real&&d.camp_date===new Intl.DateTimeFormat("sv-SE",{timeZone:"Asia/Tokyo"}).format(new Date());
  document.title=`${d.name.slice(0,40)} | ヤスネ帳`;
  $("main").innerHTML=`
  <section class="box hero">
    <div class="photo">${d.image?`<img src="${esc(d.image)}" alt="">`:""}</div>
    <div>
      <div class="maker">${esc(d.maker||"")}${d.shop?` ・ ${esc(d.shop)}`:""}</div>
      <h1>${esc(d.name)}</h1>
      <div class="badges">${badges.map(b=>`<span class="badge">${b}</span>`).join("")}${end?`<span class="badge">セール ${esc(end)}</span>`:""}</div>
      <div><span class="now">${num(d.now)}<small>円</small></span>${d.was?`<span class="was">${num(d.was)}円</span>`:""}</div>
      <dl class="rows">
        ${d.points?`<div><dt>ストアポイント（誰でも）</dt><dd>−${num(d.points)}pt</dd></div>`:""}
        <div class="big"><dt>実質価格</dt><dd>${num(real)}円</dd></div>
        ${camp?`<div><dt>今日のキャンペーン（最大${d.camp_rate}%・要エントリー）</dt><dd>−${num(d.camp_points)}pt</dd></div><div class="big"><dt>キャンペーン込み実質（最大）</dt><dd>約${num(d.camp_real)}円</dd></div>`:""}
        ${d.unit_price?`<div><dt>${d.count}${esc(d.unit)}入り・1${esc(d.unit)}あたり</dt><dd>${num(d.unit_price)}円</dd></div>`:""}
        ${d.postage>0&&!(d.ship===2)?`<div class="total"><dt>送料込み（目安）</dt><dd>${num(real+d.postage)}円</dd></div>`:""}
        ${d.premium_points&&d.premium_points>(d.points||0)?`<div><dt>LYPプレミアム会員なら</dt><dd>+${num(d.premium_points)}pt</dd></div>`:""}
        ${d.reviews?`<div><dt>レビュー</dt><dd>★${d.rating??"-"}（${num(d.reviews)}件）</dd></div>`:""}
      </dl>
      <p class="small">お店へのボタンは、下の「送料」と「買う前に」のあとにあります。</p>
    </div>
  </section>

  <section class="box">
    <h2>送料</h2>
    ${shipBox(d)}
  </section>

  <section class="box entry">
    <h2>買う前に：毎日エントリー（押さないと上乗せポイントが付きません）</h2>
    ${isFive?`<div class="five">今日は「5のつく日」。エントリーすると、さらにポイントが上乗せされます。</div>`:""}
    <ol>
      <li>Yahoo!ショッピングアプリの<b>カート</b>を開く</li>
      <li>「本日のおトク（<b>デイリーボーナス</b>）」の下までスクロール</li>
      <li><b>「まとめてエントリー&amp;クーポン獲得」</b>を押す</li>
      <li>そのあと下の「${STORE[d.store]||"お店"}で見る」から買う</li>
    </ol>
    <p class="small">エントリーは毎日リセットされます。買う日ごとに押してください。${isFive?"5のつく日のキャンペーンは別にエントリーが必要な場合があります。":""}</p>
    <div id="kaidoki" hidden></div>
    ${under3000?`<p class="small"><b>この商品だけだと${num(real)}円で、デイリーボーナスの条件（1回の注文3,000円以上）に届きません。</b>同じお店でほかの商品と合わせて3,000円以上にすると対象になります（対象ストアのみ）。</p>`:`<p class="small">1回の注文が3,000円以上なので、対象ストアならデイリーボーナスの上乗せが付きます（上限あり）。</p>`}
  </section>

  <a class="go" href="${esc(d.url)}" target="_blank" rel="noopener sponsored">${STORE[d.store]||"お店"}で見る</a>
  <p class="small" style="text-align:center;margin:0 0 14px">お店のページに移動します。値段と送料は買う前にもう一度確認してください。</p>

  <section class="box">
    <h2>ポイントについて</h2>
    <ul>
      <li><b>実質価格</b>は、セール価格から誰でももらえるストアポイントを引いた金額です。ポイントは後日、期間限定のPayPayポイントでもらえます。</li>
      <li>次のポイントは人によって違うので、実質価格に<b>入れていません</b>：PayPayで払う（＋0.5%）、LYPプレミアム会員（＋2%・月の上限あり）、PayPayカード払い、デイリーボーナス（要エントリー・3,000円以上）、5のつく日（毎月5・15・25日・要エントリー）。</li>
      <li><b>キャンペーン込み実質（最大）</b>は、もらえるポイントも値引きと考えて、今日の最大付与率（「お得な買い時」の数字）で計算した目安です。最大になるのは、エントリー・対象ストア・1回3,000円以上・PayPayカード払いなどの条件を全部満たしたときです。上限もあるので、実際はこれより高くなることがあります。</li>
      <li>率は2026年11月時点の目安です。最新の条件はアプリのカート画面や公式ページで確認してください。</li>
    </ul>
  </section>`;
}

fetch("deals.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  const d=(j.deals||[]).find(x=>x.id===id);
  if(!d){$("main").innerHTML=`<p class="empty">この商品は掲載が終わりました（セールが終わったか、値段が上がった可能性があります）。<br><a href="./">一覧にもどる</a></p>`;return}
  render(d);
  const k=document.createElement("script");k.src="kaidoki.js";document.body.append(k);
}).catch(()=>{$("main").innerHTML=`<p class="empty">データを読み込めませんでした。時間をおいて開き直してください。<br><a href="./">一覧にもどる</a></p>`});
</script>
</body>
</html>
