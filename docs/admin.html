<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ヤスネ帳 管理</title>
<link rel="icon" type="image/png" href="favicon.png">
<meta name="theme-color" content="#e8742c">
<link rel="stylesheet" href="page.css">
<style>
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px}
.tabs button,.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 14px;font:500 .9rem var(--body)}
.tabs button[aria-pressed=true],.chips button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs .n{font-size:.75rem;opacity:.8;margin-left:4px}
#q{width:100%;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:16px var(--body);margin-bottom:10px}
.it{display:grid;grid-template-columns:64px 1fr;gap:10px;background:var(--surface);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 1px 2px rgba(30,40,50,.06)}
.it img{width:64px;height:64px;object-fit:contain;border-radius:8px;background:#fff}
.it .nm{font-size:.86rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--fg);text-decoration:none}
.it .meta{font-size:.78rem;color:var(--muted);line-height:1.5;margin-top:2px}
.it .pr{font-weight:700;color:var(--fg)}
.it .off{color:var(--accent-ink);font-weight:700}
.it .act{grid-column:1/-1;display:flex;gap:8px}
.it .act button{flex:1;min-height:44px;border-radius:10px;border:0;font:700 .95rem var(--body);cursor:pointer}
.hide{background:#f3d6d6;color:#8a1f1f}
.show{background:var(--accent);color:#fff}
.undo{background:var(--line);color:var(--fg)}
.it.done{opacity:.55}
.tag{display:inline-block;font-size:.72rem;padding:0 6px;border-radius:6px;background:var(--accent-soft);color:var(--accent-ink);margin-right:4px}
.note{font-size:.8rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2a3138;color:#fff;padding:10px 16px;border-radius:999px;font-size:.88rem;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><img src="logo.webp" alt="" width="36" height="36"><a href="./">ヤスネ帳 管理</a><a class="back" href="./">サイトを見る →</a></div>
  <p class="note">「隠す」はサイトからすぐ消えます。「載せる」は次の更新（7・12・18・22時ごろ）から、安いときにサイトに出ます。間違えたら「操作済み」から戻せます。</p>
  <div class="tabs" id="tabs">
    <button data-t="live" aria-pressed="true">掲載中<span class="n" id="n-live"></span></button>
    <button data-t="cand" aria-pressed="false">候補<span class="n" id="n-cand"></span></button>
    <button data-t="done" aria-pressed="false">操作済み<span class="n" id="n-done"></span></button>
  </div>
  <div class="chips" id="chips"></div>
  <input id="q" type="search" placeholder="商品名・メーカーでしぼる">
  <div id="list"><p class="empty">読み込み中…</p></div>
</div>
<div id="toast"></div>
<script>
const FORM="https://docs.google.com/forms/d/e/1FAIpQLScyljiLm61LouGImEarjgDx0nMdXUtC6Hgo4Y1YrkTkf4oqPw/formResponse";
const F_OP="entry.1883830690",F_ID="entry.154603921",F_INFO="entry.1400588682";
const SHEET="https://docs.google.com/spreadsheets/d/1GT8YOJjHL17nyQX4PCqwZUjj-GFEihHCLBGTif4--Qs/gviz/tq?tqx=out:csv";
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>v==null?"":Number(v).toLocaleString("ja-JP");
function parseCsv(t){return t.trim().split(/\r?\n/).map(l=>[...l.matchAll(/"((?:[^"]|"")*)"/g)].map(m=>m[1].replace(/""/g,'"')))}
let live=[],cand=[],ops={},tab="live",genre="すべて";
// ops[id] = {op, info, name}  最後に押したボタン

function toast(t){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),1800)}
function infoOf(d){return [d.genre||"",d.jan||"",(d.name||"").slice(0,120)].join("|")}
async function send(op,d){
  const info=d.info??infoOf(d);
  ops[d.id]={op,info,name:d.name};
  render();
  try{
    await fetch(FORM,{method:"POST",mode:"no-cors",body:new URLSearchParams({[F_OP]:op,[F_ID]:d.id,[F_INFO]:info})});
    toast(op==="隠す"?"隠しました":op==="載せる"?"載せる候補に入れました":"元に戻しました");
  }catch(e){toast("送れませんでした。電波を確認してもう一度");delete ops[d.id];render()}
}
function card(d,mode){
  const o=ops[d.id]?.op;
  const price=d.now!=null?`<span class="pr">${num(d.now)}円</span>`+(d.off?` <span class="off">${d.off}%OFF</span>`:"")+(d.points?` ・ ${num(d.points)}pt`:"")+(d.real!=null?` ・ 実質${num(d.real)}円`:""):(d.unit_price?`<span class="pr">${d.unit_price}円/${esc(d.unit||"本")}</span>`:"");
  let btn;
  if(mode==="live") btn=o==="隠す"?`<button class="undo" data-op="戻す">隠したのを戻す</button>`:`<button class="hide" data-op="隠す">隠す</button>`;
  else if(mode==="cand") btn=o==="載せる"?`<button class="undo" data-op="戻す">載せるのをやめる</button>`:`<button class="show" data-op="載せる">載せる</button><button class="hide" data-op="隠す">候補から消す</button>`;
  else btn=`<button class="undo" data-op="戻す">戻す（${esc(o)}を取り消し）</button>`;
  const done=(mode==="live"&&o==="隠す")||(mode==="cand"&&o==="載せる");
  return `<div class="it${done?" done":""}" data-id="${esc(d.id)}">
    ${d.image?`<img src="${esc(d.image)}" alt="" loading="lazy">`:"<span></span>"}
    <div><a class="nm" href="${esc(d.page||d.url||"#")}" target="_blank" rel="noopener">${esc(d.name)}</a>
    <div class="meta">${d.genre?`<span class="tag">${esc(d.genre)}</span>`:""}${d.why?`<span class="tag">${esc(d.why)}</span>`:""}${esc(d.maker||"")}${d.shop?" ・ "+esc(d.shop):""}</div>
    <div class="meta">${price}</div></div>
    <div class="act">${btn}</div></div>`;
}
function items(){
  if(tab==="live") return live;
  if(tab==="cand") return cand.filter(d=>ops[d.id]?.op!=="隠す");
  const all=Object.fromEntries([...cand,...live].map(d=>[d.id,d]));
  return Object.entries(ops).filter(([,v])=>v.op==="隠す"||v.op==="載せる").map(([id,v])=>({...(all[id]||{}),id,name:all[id]?.name||v.info.split("|")[2]||id,genre:all[id]?.genre||v.info.split("|")[0],info:v.info,why:v.op}));
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const base=items();
  const gs=["すべて",...new Set(base.map(d=>d.genre).filter(Boolean))];
  if(!gs.includes(genre))genre="すべて";
  $("chips").innerHTML=gs.map(g=>`<button data-g="${esc(g)}" aria-pressed="${g===genre}">${esc(g)}</button>`).join("");
  const list=base.filter(d=>(genre==="すべて"||d.genre===genre)&&(!q||(d.name+" "+(d.maker||"")).toLowerCase().includes(q)));
  $("list").innerHTML=list.length?list.map(d=>card(d,tab)).join(""):`<p class="empty">${tab==="done"?"まだ何も操作していません":"ありません"}</p>`;
  $("n-live").textContent=live.length;$("n-cand").textContent=cand.filter(d=>ops[d.id]?.op!=="隠す").length;
  $("n-done").textContent=Object.values(ops).filter(v=>v.op!=="戻す").length;
}
$("tabs").onclick=e=>{const b=e.target.closest("button");if(!b)return;tab=b.dataset.t;document.querySelectorAll("#tabs button").forEach(x=>x.setAttribute("aria-pressed",x===b));render()};
$("chips").onclick=e=>{const b=e.target.closest("button");if(!b)return;genre=b.dataset.g;render()};
$("q").oninput=render;
$("list").onclick=e=>{
  const b=e.target.closest("button[data-op]");if(!b)return;
  const id=b.closest(".it").dataset.id;
  const d=items().find(x=>x.id===id);if(d)send(b.dataset.op,d);
};
Promise.all([
  fetch("deals.json",{cache:"no-store"}).then(r=>r.json()).then(j=>live=j.deals||[]).catch(()=>{}),
  fetch("candidates.json",{cache:"no-store"}).then(r=>r.json()).then(j=>cand=j.items||[]).catch(()=>{}),
  fetch(SHEET).then(r=>r.text()).then(t=>{for(const r of parseCsv(t).slice(1))if(/^[0-9a-f]{10}$/.test(r[2]||""))ops[r[2]]={op:r[1],info:r[3]||""}}).catch(()=>{})
]).then(render);
</script>
</body>
</html>
