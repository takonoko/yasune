<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ヤスネ帳</title>
<meta name="description" content="家電・日用品・食品・ガジェットのセール品を、ポイント還元込みの実質価格で毎日まとめています。">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e8742c">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* 明るく、やわらかく。値札の赤ではなくオレンジ、ポイントは緑で区別する */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --fg:#2a3138; --muted:#6b7680; --line:#e3e8ec;
  --accent:#e8742c; --accent-soft:#fdeee3; --accent-ink:#b4521a;
  --point:#1f8a5b; --point-soft:#e4f4ec;
  --chip:#ffffff; --chip-on:#2a3138; --chip-on-ink:#ffffff;
  --round:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#1c2228; --surface:#252c33; --fg:#e9edf0; --muted:#a3adb5; --line:#343d45;
  --accent:#f29a5c; --accent-soft:#3a2c22; --accent-ink:#f6b98c;
  --point:#5cc995; --point-soft:#1f3a2e;
  --chip:#252c33; --chip-on:#e9edf0; --chip-on-ink:#1c2228; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 var(--body)}
img{max-width:100%}
.wrap{max-width:1040px;margin:0 auto;padding-block:24px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:grid;gap:4px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:44px;height:44px;border-radius:50%;display:block;flex:none}
header{grid-template-columns:minmax(0,1fr) auto;align-items:center;column-gap:16px}
header>.text{display:grid;gap:4px;min-width:0}
.mascot{width:120px;height:120px;border-radius:50%;display:block}
@media (min-width:640px){.mascot{width:160px;height:160px}}
h1{font:700 1.6rem var(--round);margin:0;letter-spacing:.04em}
.lead{color:var(--muted);font-size:.9rem;margin:0}
.updated{color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.controls{display:grid;gap:10px;margin:20px 0 16px}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs button{font:500 .95rem var(--body);padding:8px 16px;border:1px solid var(--line);background:var(--chip);color:var(--fg);border-radius:999px;cursor:pointer;white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on)}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;color:var(--muted);font-size:.85rem}
select{font:inherit;font-size:.9rem;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}}
.card{background:var(--surface);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(30,40,50,.06)}
.card:hover{box-shadow:0 4px 14px rgba(30,40,50,.12)}
.thumb{position:relative;aspect-ratio:1;background:#fff;display:grid;place-items:center;padding:10px}
.thumb img{width:100%;height:100%;object-fit:contain}
.off{position:absolute;top:8px;left:8px;font:700 .8rem var(--round);background:var(--accent-soft);color:var(--accent-ink);padding:3px 9px;border-radius:999px;font-variant-numeric:tabular-nums}
.body{padding:12px 12px 14px;display:grid;gap:6px;flex:1;align-content:start}
.name{margin:0;font-size:.85rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px;font-variant-numeric:tabular-nums}
.now{font:700 1.3rem var(--round)}
.now small{font-size:.75rem;margin-left:1px}
.was{color:var(--muted);text-decoration:line-through;font-size:.75rem}
.pt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;background:var(--point-soft);color:var(--point);border-radius:8px;padding:5px 8px;font-size:.78rem;font-variant-numeric:tabular-nums}
.pt b{font-weight:700}
.meta{color:var(--muted);font-size:.72rem;display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.soon{color:var(--accent-ink)}
.empty{color:var(--muted);padding:32px 0}
.note{margin-top:32px;color:var(--muted);font-size:.78rem;display:grid;gap:4px;max-width:65ch}
.note a{color:inherit}
.watch{margin:20px 0 4px;display:grid;gap:10px}
.watch h2{font:700 1.1rem var(--round);margin:0}
.wlist{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px}
.witem{flex:0 0 200px;background:var(--surface);border-radius:14px;padding:10px;display:grid;grid-template-columns:56px minmax(0,1fr);gap:4px 10px;color:inherit;text-decoration:none;box-shadow:0 1px 2px rgba(30,40,50,.06)}
.witem>:first-child{width:56px;height:56px;object-fit:contain;background:#fff;border-radius:8px;grid-row:span 3}
.witem .wn{font-size:.8rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.witem .wp{font:700 1.05rem var(--round);font-variant-numeric:tabular-nums}
.witem .wm{font-size:.7rem;color:var(--muted)}
.witem .low{color:var(--point);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="text">
      <div class="brand"><img class="logo" src="logo.webp" alt="" width="44" height="44"><h1>ヤスネ帳</h1></div>
      <p class="lead">家電・日用品・食品・ガジェットのセール品を、ポイント込みの実質価格でまとめています。</p>
      <div class="updated" id="updated">読み込み中…</div>
    </div>
    <img class="mascot" src="mascot.webp" alt="買い物袋をたくさん持ったタコ" width="160" height="160">
  </header>
  <section class="watch" id="watch" hidden>
    <h2>いつもチェック</h2>
    <div class="wlist" id="wlist"></div>
  </section>
  <div class="controls">
    <nav class="tabs" id="tabs" aria-label="ジャンル"></nav>
    <div class="bar">
      <label for="sort">並び順</label>
      <select id="sort">
        <option value="real_off">実質のお得さ順</option>
        <option value="off">値引き率順</option>
        <option value="end">セール終了が近い順</option>
        <option value="price">実質価格が安い順</option>
        <option value="reviews">レビューが多い順</option>
      </select>
      <span id="count"></span>
    </div>
  </div>
  <section class="grid" id="grid"></section>
  <div class="note">
    <span>実質価格は、セール価格から誰でももらえるストアポイントを引いた金額です。キャンペーンやカードのポイントは含みません。</span>
    <span>価格・在庫・ポイントは更新時点のものです。購入前に販売ページで必ずご確認ください。</span>
    <span>当サイトはアフィリエイト広告を利用しています。</span>
    <span><a href="https://developer.yahoo.co.jp/sitemap/" target="_blank" rel="noopener">Web Services by Yahoo! JAPAN</a></span>
  </div>
</div>
<script>
const GENRES=["すべて","家電","日用品","食品","ガジェット"];
const STORE={yahoo:"Yahoo!ショッピング",rakuten:"楽天市場",amazon:"Amazon"};
let deals=[],genre="すべて";
const $=id=>document.getElementById(id);
const num=v=>Number(v).toLocaleString("ja-JP");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function left(t){if(!t)return null;const h=Math.round((t*1000-Date.now())/36e5);if(h<0)return null;return h<24?{txt:`あと${h}時間`,soon:true}:{txt:`あと${Math.floor(h/24)}日`,soon:false}}
GENRES.forEach(g=>{const b=document.createElement("button");b.type="button";b.textContent=g;b.setAttribute("aria-pressed",g===genre);
  b.onclick=()=>{genre=g;[...$("tabs").children].forEach(x=>x.setAttribute("aria-pressed",x===b));render()};$("tabs").append(b)});
function card(d){
  const real=d.real??d.now, l=left(d.end);
  const pt=d.points?`<div class="pt"><span><b>+${num(d.points)}pt</b> 還元</span><span>実質 <b>${num(real)}円</b></span></div>`:"";
  return `<a class="card" href="${esc(d.url)}" target="_blank" rel="noopener sponsored">
    <div class="thumb">${d.image?`<img src="${esc(d.image)}" alt="" loading="lazy">`:""}<span class="off">${d.off}%OFF</span></div>
    <div class="body">
      <p class="name">${esc(d.name)}</p>
      <div class="price"><span class="now">${num(d.now)}<small>円</small></span><span class="was">${num(d.was)}円</span></div>
      ${pt}
      <div class="meta">${l?`<span class="${l.soon?"soon":""}">セール${l.txt}</span>`:""}${d.reviews?`<span>★${d.rating??"-"}（${num(d.reviews)}）</span>`:""}${d.free_shipping?"<span>送料無料</span>":""}<span>${STORE[d.store]||""}</span></div>
    </div></a>`;
}
function render(){
  const so=$("sort").value;
  let list=deals.filter(d=>genre==="すべて"||d.genre===genre).filter(d=>!d.end||d.end*1000>Date.now());
  const r=d=>d.real??d.now;
  const cmp={real_off:(a,b)=>(b.real_off??b.off)-(a.real_off??a.off),off:(a,b)=>b.off-a.off,end:(a,b)=>(a.end||9e9)-(b.end||9e9),price:(a,b)=>r(a)-r(b),reviews:(a,b)=>(b.reviews||0)-(a.reviews||0)}[so];
  list.sort(cmp);
  $("count").textContent=`${list.length}件`;
  $("grid").innerHTML=list.map(card).join("")||`<p class="empty">いまこのジャンルに載せられるセール品はありません。次の更新をお待ちください。</p>`;
}
$("sort").onchange=render;
// スプレッドシートの「載せない商品」に書いた言葉かURLを含む商品は出さない（開くたびに読む）
const NG_SHEET="18xEzO00ztRWrRg3T1Ihz1kWFBpqCqN8_QmciVmYBU8I";
let ng=[];
function parseCsv(t){return t.trim().split(/\r?\n/).map(l=>[...l.matchAll(/"((?:[^"]|"")*)"/g)].map(m=>m[1].replace(/""/g,'"')))}
const nz=s=>String(s||"").normalize("NFKC").toLowerCase().replace(/\s/g,"");
function isNg(d){return ng.some(w=>w&&(nz(d.name).includes(w)||String(d.url||"").includes(w)))}
const origRender=render;
render=function(){const keep=deals;deals=deals.filter(d=>!isNg(d));origRender();deals=keep};
fetch(`https://docs.google.com/spreadsheets/d/${NG_SHEET}/gviz/tq?tqx=out:csv`).then(r=>r.text()).then(t=>{ng=parseCsv(t).slice(1).map(r=>nz(r[0])).filter(Boolean);if(deals.length)render()}).catch(()=>{});
// いつもチェック
fetch("watch.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  const items=(j.items||[]).filter(x=>x.show&&x.found);
  if(!items.length)return;
  $("wlist").innerHTML=items.map(x=>`<a class="witem" href="${esc(x.url)}" target="_blank" rel="noopener sponsored">
    ${x.image?`<img src="${esc(x.image)}" alt="" loading="lazy">`:"<span></span>"}
    <span class="wn">${esc(x.name)}</span>
    <span class="wp">${num(x.price)}円</span>
    <span class="wm">${x.min!=null&&x.price<=x.min?'<span class="low">過去最安</span>':`過去最安 ${num(x.min)}円`}</span>
  </a>`).join("");
  $("watch").hidden=false;
}).catch(()=>{});
fetch("deals.json",{cache:"no-store"}).then(r=>r.json()).then(j=>{
  deals=j.deals||[];
  $("updated").textContent="最終更新 "+new Date(j.updated).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});
  render();
}).catch(()=>{$("updated").textContent="";$("grid").innerHTML='<p class="empty">データを読み込めませんでした。時間をおいて開き直してください。</p>'});
</script>
</body>
</html>
